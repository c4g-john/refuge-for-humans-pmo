name: scope dispatch

# Scope changes should reach the delivery boards in seconds, not at the next
# cron. On any documents/ change on main, dispatch the bridge scaffold of each
# affected project's mapped repository. Same-repo projects use the built-in
# token (workflow_dispatch is exempt from GITHUB_TOKEN's no-retrigger rule);
# cross-repo projects use DISPATCH_TOKEN, a fine-grained PAT holding only
# Actions read/write on the target repos.
# Missing credentials are reported explicitly; no periodic polling remains.
on:
  push:
    branches: [main]
    paths: ["documents/**"]
  workflow_dispatch:
    inputs:
      project:
        description: "PRJ id to dispatch regardless of diff (e.g. PRJ-004-ADO)"
        required: false

permissions:
  contents: read
  actions: write

concurrency:
  group: scope-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Route changed projects to their mapped repositories
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_BRIDGE_ENABLED: ${{ vars.BRIDGE_ENABLED }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          FORCED: ${{ inputs.project }}
        run: |
          if [ -n "$FORCED" ]; then
            projects="$FORCED"
          else
            base="$BEFORE"
            case "$base" in ""|0000000000000000000000000000000000000000) base="$AFTER~1";; esac
            projects=$(git diff --name-only "$base" "$AFTER" -- documents/ | awk -F/ '/^documents\// {print $2}' | sort -u)
          fi
          if [ -z "$projects" ]; then echo "no project documents changed"; exit 0; fi
          failures=0
          declare -A routed=()
          for prj in $projects; do
            anchor="documents/$prj/project.md"
            if [ ! -f "$anchor" ]; then echo "$prj: no anchor, skipping"; continue; fi
            repo=$(grep -E "^repo:" "$anchor" | head -n1 | sed 's/^repo:[[:space:]]*//' | tr -d '"' | tr -d "'")
            if [ -z "$repo" ]; then echo "$prj: no repo mapping"; continue; fi
            # One scaffold handles every project mapped to its target repo.
            if [ -n "${routed[$repo]:-}" ]; then
              echo "$prj -> $repo already routed in this run"
              continue
            fi
            routed["$repo"]=1
            # The enabled local bridge already writes to the app on docs pushes.
            # Route through exactly one path; a failed local job remains visible.
            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$repo" = "c4g-john/refuge-for-humans-app" ] && [ "$LOCAL_BRIDGE_ENABLED" = "true" ]; then
              echo "$prj -> $repo (handled by the enabled direct bridge)"
              continue
            fi
            if [ "$repo" = "$GITHUB_REPOSITORY" ]; then
              # A documents push already starts the local scaffold directly.
              # Keep explicit manual dispatches, including forced projects.
              if [ "$GITHUB_EVENT_NAME" = "push" ]; then
                echo "$prj -> $repo (handled by the direct push trigger)"
                continue
              fi
              if gh workflow run bridge-scaffold.yml --repo "$repo"; then
                echo "$prj -> $repo (same-repo)"
              else
                echo "::error::Dispatch failed for $repo"
                echo "- Retry [bridge scaffold](https://github.com/$repo/actions/workflows/bridge-scaffold.yml)." >> "$GITHUB_STEP_SUMMARY"
                failures=1
              fi
            elif [ -n "$DISPATCH_TOKEN" ]; then
              if GH_TOKEN="$DISPATCH_TOKEN" gh workflow run bridge-scaffold.yml --repo "$repo"; then
                echo "$prj -> $repo (dispatched)"
              else
                echo "::error::Cross-repository dispatch failed for $repo"
                echo "- Retry [bridge scaffold](https://github.com/$repo/actions/workflows/bridge-scaffold.yml); check the existing DISPATCH_TOKEN access." >> "$GITHUB_STEP_SUMMARY"
                failures=1
              fi
            else
              echo "::error::$prj -> $repo not dispatched: DISPATCH_TOKEN is unset. No scheduled fallback exists."
              echo "- Run [bridge scaffold](https://github.com/$repo/actions/workflows/bridge-scaffold.yml) manually. Automatic cross-repository delivery requires an existing authorized DISPATCH_TOKEN." >> "$GITHUB_STEP_SUMMARY"
              failures=1
            fi
          done
          exit "$failures"
